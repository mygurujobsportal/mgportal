<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyGuru Portal - Admin Gate</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 10px; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #f59e0b; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; }
        .error { color: #fca5a5; font-size: 13px; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color: #f59e0b; text-align: center; margin-top: 0;">🛡️ Admin Login</h2>
    <div id="errorBox" class="error"></div>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Admin Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="loginBtn">Authorize & Access</button>
    </form>
</div>

<script>
    const SUPABASE_URL = 'https://sugomkzvytuncybafngf.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // మీ సుపాబేస్ Anon Key వేయండి
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // prevents page refresh
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorBox = document.getElementById('errorBox');
        const loginBtn = document.getElementById('loginBtn');

        errorBox.style.display = 'none';
        loginBtn.innerText = 'Verifying...';

        try {
            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) throw error;

            // Success: Local Storage లో సెషన్ గుర్తుపెట్టుకొని రీడైరెక్ట్
            localStorage.setItem('adminLoggedIn', 'true');
            window.location.href = './dashboard.html';

        } catch (err) {
            errorBox.innerText = err.message || 'లాగిన్ విఫలమైంది!';
            errorBox.style.display = 'block';
            loginBtn.innerText = 'Authorize & Access';
        }
    });
</script>
</body>
</html>
