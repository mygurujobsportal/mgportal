<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyGuru - Admin Access Gate</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0f172a; color: #fff; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #334155; }
        h2 { color: #f59e0b; text-align: center; margin-top: 0; font-size: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 12px; background: #f59e0b; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; margin-top: 10px; color: #000; font-size: 15px; }
        .error { color: #fca5a5; background: rgba(239,68,68,0.15); padding: 12px; border-radius: 6px; font-size: 13px; display: none; margin-bottom: 12px; border: 1px solid #ef4444; line-height: 1.4; }
    </style>
</head>
<body>

<div class="card">
    <h2>🛡️ MyGuru Admin Gate</h2>
    <div id="errorBox" class="error"></div>
    <form id="adminLoginForm">
        <input type="email" id="email" placeholder="Admin Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="loginBtn">Authorize & Access</button>
    </form>
</div>

<script>
    const SUPABASE_URL = 'https://sugomkzvytuncybafngf.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // మీ సుపాబేస్ Anon Key ఉంచండి
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorBox = document.getElementById('errorBox');
        const loginBtn = document.getElementById('loginBtn');

        errorBox.style.display = 'none';
        loginBtn.innerText = 'Verifying...';
        loginBtn.disabled = true;

        try {
            // 1. Supabase Auth Check
            const { data: authData, error: authError } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (authError) throw authError;

            // 2. Fetch Role
            const { data: userData, error: userError } = await _supabase
                .from('common_users')
                .select('role')
                .eq('id', authData.user.id)
                .maybeSingle();

            // Strict Role Match (admin కాకపోతే లేదా తప్పు రోల్ ఉంటే)
            const userRole = userData ? String(userData.role).toLowerCase() : '';

            if (userError || userRole !== 'admin') {
                // Instantly clear localStorage and Sign Out from Supabase
                localStorage.removeItem('adminLoggedIn');
                await _supabase.auth.signOut();

                throw new Error("❌ Access Denied! This portal is restricted to Admins only. Teachers & Schools must login from the main portal.");
            }

            // 3. Success: Set Admin Flag & Redirect
            localStorage.setItem('adminLoggedIn', 'true');
            window.location.href = 'dashboard.html';

        } catch (err) {
            console.error("Login Check Error:", err);
            
            // Clean up session completely on error
            localStorage.removeItem('adminLoggedIn');
            
            errorBox.innerText = err.message || 'లాగిన్ విఫలమైంది!';
            errorBox.style.display = 'block';
            loginBtn.innerText = 'Authorize & Access';
            loginBtn.disabled = false;
        }
    });
</script>
</body>
</html>
