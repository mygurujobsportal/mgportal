<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyGuru Admin Access Gate</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0f172a; color: #fff; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #334155; }
        h2 { color: #f59e0b; text-align: center; margin-top: 0; font-size: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 12px; background: #f59e0b; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; margin-top: 10px; color: #000; font-size: 15px; }
        .error { color: #fca5a5; background: rgba(239,68,68,0.1); padding: 10px; border-radius: 6px; font-size: 13px; display: none; margin-bottom: 10px; border: 1px solid #ef4444; }
    </style>
</head>
<body>

<div class="card">
    <h2>🛡️ MyGuru Admin Gate</h2>
    <div id="errorBox" class="error"></div>
    <form id="adminLoginForm">
        <input type="email" id="email" placeholder="Admin Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="loginBtn">Authorize & Access</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://sugomkzvytuncybafngf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1Z29ta3p2eXR1bmN5YmFmbmdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NjM5ODQsImV4cCI6MjA5OTEzOTk4NH0.JNwUYVXdqj0hyVhf1ZjL-YDvY_AekJg9sZE9fuDH9q0'; // మీ ఒరిజినల్ anon key వేయండి

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorBox = document.getElementById('errorBox');
        const loginBtn = document.getElementById('loginBtn');

        errorBox.style.display = 'none';
        loginBtn.innerText = 'Verifying...';

        try {
            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                alert("❌ లాగిన్ ఫెయిల్ అయ్యింది: " + error.message);
                throw error;
            }

            alert("✅ లాగిన్ సక్సెస్! Dashboard కి రీడైరెక్ట్ అవుతోంది...");
            localStorage.setItem('adminLoggedIn', 'true');
            window.location.href = 'dashboard.html';

        } catch (err) {
            errorBox.innerText = err.message || 'లాగిన్ విఫలమైంది!';
            errorBox.style.display = 'block';
            loginBtn.innerText = 'Authorize & Access';
        }
    });
</script>
</body>
</html>
