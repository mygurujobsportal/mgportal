<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password - MyGuru Jobs Portal</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 600;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
    }

    .login-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">MyGuru Jobs Portal</div>

    <div class="subtitle">
      Create your new password
    </div>

    <form id="resetPasswordForm">

      <label for="newPassword">
        New Password
      </label>

      <input
        type="password"
        id="newPassword"
        placeholder="Enter new password"
        minlength="6"
        required
      >

      <label for="confirmPassword">
        Confirm New Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Re-enter new password"
        minlength="6"
        required
      >

      <button type="submit" id="resetButton">
        Reset Password
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="login-link">
      <a href="index.html">← Back to Login</a>
    </div>

  </div>


<script>

/* =========================================
   SUPABASE CONFIGURATION
   ========================================= */

const SUPABASE_URL =
  "https://sugomkzvytuncybafngf.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1Z29ta3p2eXR1bmN5YmFmbmdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NjM5ODQsImV4cCI6MjA5OTEzOTk4NH0.JNwUYVXdqj0hyVhf1ZjL-YDvY_AekJg9sZE9fuDH9q0";


const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================
   SHOW MESSAGE
   ========================================= */

function showMessage(text, type) {

  const message = document.getElementById("message");

  message.textContent = text;

  message.className = "message " + type;

  message.style.display = "block";
}


/* =========================================
   RESET PASSWORD
   ========================================= */

document
  .getElementById("resetPasswordForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const newPassword =
      document.getElementById("newPassword").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    const button =
      document.getElementById("resetButton");


    /* Password match */

    if (newPassword !== confirmPassword) {

      showMessage(
        "Passwords do not match.",
        "error"
      );

      return;
    }


    /* Minimum length */

    if (newPassword.length < 6) {

      showMessage(
        "Password must be at least 6 characters.",
        "error"
      );

      return;
    }


    button.disabled = true;

    button.textContent = "Updating...";


    try {

      const { data, error } =
        await supabaseClient.auth.updateUser({
          password: newPassword
        });


      if (error) {

        throw error;

      }


      showMessage(
        "Password updated successfully! You can now login with your new password.",
        "success"
      );


      document
        .getElementById("resetPasswordForm")
        .reset();


      button.textContent = "Password Updated";


      setTimeout(function() {

        window.location.href = "index.html";

      }, 2500);


    } catch (error) {

      console.error(
        "Password reset error:",
        error
      );


      showMessage(
        "Password reset failed: " + error.message,
        "error"
      );


      button.disabled = false;

      button.textContent = "Reset Password";

    }

  });

</script>

</body>
</html>
