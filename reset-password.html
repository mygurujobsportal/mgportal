<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password - MyGuru Jobs Portal</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 600;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus { border-color: #2563eb; }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
    }

    .login-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="card">

    <div class="logo">MyGuru Jobs Portal</div>

    <div class="subtitle" id="subtitle">
      Verifying your password reset link...
    </div>

    <form id="resetPasswordForm" hidden>

      <label for="newPassword">New Password</label>

      <input
        type="password"
        id="newPassword"
        placeholder="Enter new password"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">Confirm New Password</label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Re-enter new password"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <button type="submit" id="resetButton">
        Reset Password
      </button>

    </form>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <div class="login-link">
      <a href="index.html">← Back to Login</a>
    </div>

  </div>

<script>
(() => {
  'use strict';

  const SUPABASE_URL = 'https://sugomkzvytuncybafngf.supabase.co';

const SUPABASE_ANON_KEY = 'sb_publishable_YwOJUt0JVvWlpf01eV5y6Q_t3LYbQqy';

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY,
    {
        auth: {
            persistSession: false,
            autoRefreshToken: false,
            detectSessionInUrl: false
        }
    }
);

  const form = document.getElementById('resetPasswordForm');
  const button = document.getElementById('resetButton');
  const message = document.getElementById('message');
  const subtitle = document.getElementById('subtitle');

  let recoveryVerified = false;
  let processing = false;

  function showMessage(text, type) {
    message.textContent = text;
    message.className = 'message ' + type;
    message.style.display = 'block';
  }

  function showError(text) {
    recoveryVerified = false;
    form.hidden = true;
    subtitle.textContent = 'Password Reset';
    showMessage(text, 'error');
  }

  async function initializeRecovery() {
    try {
      const url = new URL(window.location.href);
      const params = url.searchParams;
      const hash = new URLSearchParams(
        url.hash.replace(/^#/, '')
      );

      // Handle recovery errors returned by Supabase.
      const errorCode =
        params.get('error_code') || hash.get('error_code');

      const errorDescription =
        params.get('error_description') ||
        hash.get('error_description');

      if (errorCode || params.has('error') || hash.has('error')) {
        throw new Error(
          errorDescription
            ? errorDescription.replace(/\+/g, ' ')
            : 'This password reset link is invalid or expired.'
        );
      }

      // PKCE recovery links return a code in the query string.
      const code = params.get('code');

      if (code) {
        // Exchange the one-time code for a session.
        const { data, error } =
          await client.auth.exchangeCodeForSession(code);

        if (error) throw error;

        if (!data.session || !data.user) {
          throw new Error('Could not verify the recovery session.');
        }

        recoveryVerified = true;

        // Remove the one-time code from the visible URL.
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

      } else {
        // Some Supabase recovery links return tokens in the URL hash.
        const accessToken = hash.get('access_token');
        const refreshToken = hash.get('refresh_token');
        const tokenType = hash.get('type');

        if (
          !accessToken ||
          !refreshToken ||
          (tokenType && tokenType !== 'recovery')
        ) {
          throw new Error(
            'Invalid or expired recovery link. Please request a new password reset email.'
          );
        }

        const { data, error } = await client.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });

        if (error) throw error;

        if (!data.session || !data.user) {
          throw new Error('Could not verify the recovery session.');
        }

        recoveryVerified = true;

        // Remove sensitive tokens from the address bar.
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );
      }

      subtitle.textContent = 'Create your new password';
      form.hidden = false;
      showMessage(
        'Recovery link verified. You may set a new password.',
        'success'
      );

    } catch (error) {
      console.error('Recovery verification failed:', error);

      showError(
        error.message ||
        'Unable to verify this reset link. Please request a new one.'
      );
    }
  }

  form.addEventListener('submit', async function(event) {
    event.preventDefault();

    if (!recoveryVerified || processing) {
      showError(
        'Your recovery session is not valid. Please request a new reset email.'
      );
      return;
    }

    const password =
      document.getElementById('newPassword').value;

    const confirmation =
      document.getElementById('confirmPassword').value;

    if (password.length < 6) {
      showMessage(
        'Password must be at least 6 characters.',
        'error'
      );
      return;
    }

    if (password !== confirmation) {
      showMessage('Passwords do not match.', 'error');
      return;
    }

    processing = true;
    button.disabled = true;
    button.textContent = 'Updating...';

    try {
      const { data, error } = await client.auth.updateUser({
        password: password
      });

      if (error) throw error;

      if (!data.user) {
        throw new Error('Password update could not be confirmed.');
      }

      recoveryVerified = false;
      form.hidden = true;
      subtitle.textContent = 'Password Updated';

      showMessage(
        'Password updated successfully. Redirecting to login...',
        'success'
      );

      // End the recovery session after the successful update.
      await client.auth.signOut();

      setTimeout(() => {
        window.location.replace('index.html');
      }, 2000);

    } catch (error) {
      console.error('Password update failed:', error);

      showMessage(
        'Password update failed: ' +
        (error.message || 'Please request a new reset email.'),
        'error'
      );

      button.disabled = false;
      button.textContent = 'Reset Password';
      processing = false;
    }
  });

  initializeRecovery();
})();
</script>

</body>
</html>
