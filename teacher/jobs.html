<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyGuru Teacher - Search Jobs</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .search-filter-zone { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 12px; margin-bottom: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .filter-group { display: flex; flex-direction: column; }
        .filter-group label { font-size: 11px; font-weight: bold; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; }
        .filter-group input, .filter-group select { padding: 10px; background: #0f172a; border: 1px solid #2e3c51; border-radius: 6px; color: white; }
        
        .jobs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .job-card { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
        .job-card:hover { transform: translateY(-3px); border-color: #38bdf8; }
        .job-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px; }
        .school-info h4 { font-size: 16px; color: white; margin: 0 0 4px 0; }
        .school-info span { font-size: 13px; color: #94a3b8; }
        .job-badge { background: #0f172a; color: #38bdf8; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; border: 1px solid #2e3c51; }
        
        .job-details-meta { font-size: 13px; color: #cbd5e1; margin: 10px 0; line-height: 1.6; }
        .job-details-meta strong { color: #94a3b8; }
        
        .lock-warning { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #fca5a5; padding: 10px; border-radius: 6px; font-size: 12px; text-align: center; margin-top: 10px; }
        .btn-job-apply { width: 100%; background: #10b981; color: white; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; font-size: 14px; margin-top: 10px; display: block; transition: 0.2s; }
        .btn-job-apply:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

        /* Application Modal Popup Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-box {
            background: #1e293b; border: 1px solid #334155; border-radius: 14px;
            width: 90%; max-width: 480px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            color: #f8fafc;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-header h3 { margin: 0; color: #38bdf8; font-size: 18px; }
        .modal-close { background: transparent; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; line-height: 1; }
        .modal-meta { background: #0f172a; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; border: 1px solid #334155; }
        .modal-meta div { margin-bottom: 5px; }
        .modal-meta strong { color: #cbd5e1; }
        .cover-textarea {
            width: 100%; height: 110px; background: #0f172a; border: 1px solid #334155;
            border-radius: 8px; padding: 10px; color: #fff; font-family: inherit;
            font-size: 13px; resize: vertical; box-sizing: border-box; outline: none; margin-top: 6px;
        }
        .cover-textarea:focus { border-color: #38bdf8; }
        .modal-btns { display: flex; gap: 10px; margin-top: 18px; }
        .btn-submit-app {
            flex: 1; background: #10b981; color: white; border: none; padding: 12px;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;
        }
        .btn-submit-app:hover { background: #059669; }
        .btn-cancel-app {
            background: #334155; color: #cbd5e1; border: none; padding: 12px 18px;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- 🧭 Left Navigation Menu -->
    <div class="sidebar">
        <div style="text-align: center; padding: 10px;">
            <img src="../assets/logo.png" alt="MyGuru Logo" style="max-width: 80px; height: auto; border-radius: 50%;">
            <h2>MyGuru Jobs</h2>
        </div>
        <a href="dashboard.html">Dashboard</a>
        <a href="teacher_profile.html">My Profile</a>
        <a href="jobs.html" class="active">Search Jobs</a>
        <a href="applied-jobs.html">Applied Jobs</a>
        <a href="interview-letters.html">Interview Letters</a>
        <a href="notifications.html">Notifications</a>
        <a href="support.html">Support</a>
        <a href="settings.html">Settings</a>
        <a href="#" id="logout-btn" style="margin-top: auto; color: #ef4444;">Logout</a>
    </div>

    <!-- 💻 Main Content -->
    <div class="content">
        <div class="header">
            <h3>ఉపాధ్యాయ ఉద్యోగాల అన్వేషణ (Search School Jobs)</h3>
            <span class="tag" style="background: #3b82f6;">Live Jobs</span>
        </div>

        <!-- 🔍 Filters Zone -->
        <div class="search-filter-zone">
            <div class="filter-group">
                <label>Subject (సబ్జెక్ట్)</label>
                <input type="text" id="filterSubject" placeholder="e.g., Zoology, Biology" oninput="fetchFilteredJobs()">
            </div>
            <div class="filter-group">
                <label>District (జిల్లా)</label>
                <input type="text" id="filterDistrict" placeholder="e.g., Hanamkonda" oninput="fetchFilteredJobs()">
            </div>
            <div class="filter-group">
                <label>School Type</label>
                <select id="filterSchoolType" onchange="fetchFilteredJobs()">
                    <option value="">All Types</option>
                    <option value="Private">Private</option>
                    <option value="International">International</option>
                    <option value="Residential">Residential</option>
                </select>
            </div>
        </div>

        <!-- 🏢 Jobs Cards Grid Display -->
        <div class="jobs-grid" id="jobs-container">
            <p style="color: #94a3b8;">ఉద్యోగాలు లోడ్ అవుతున్నాయి...</p>
        </div>
    </div>

    <!-- Job Application Popup Modal -->
    <div id="applyModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3>📝 Confirm Job Application</h3>
                <button class="modal-close" onclick="closeApplyModal()">&times;</button>
            </div>

            <div class="modal-meta">
                <div><strong>Applying For:</strong> <span id="modalJobTitle">-</span></div>
                <div><strong>School:</strong> <span id="modalSchoolName">-</span></div>
                <div><strong>Attached Resume:</strong> <span id="modalResumeStatus" style="color: #4ade80;">Checking...</span></div>
            </div>

            <label style="font-size: 12px; font-weight: bold; color: #94a3b8; text-transform: uppercase;">Cover Letter / Message to Employer</label>
            <textarea id="modalCoverLetter" class="cover-textarea" placeholder="మీ కవర్ లెటర్ ఇక్కడ రాయండి లేదా ఎడిట్ చేయండి..."></textarea>

            <div class="modal-btns">
                <button class="btn-cancel-app" onclick="closeApplyModal()">Cancel</button>
                <button class="btn-submit-app" id="btnConfirmApply" onclick="submitFinalApplication()">Confirm & Apply</button>
            </div>
        </div>
    </div>

    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        let currentTeacherId = null;
        let isProfileComplete = false;
        let teacherProfile = null;
        let pendingJobId = null;

        async function initJobSearchEngine() {
            const session = await checkLiveUserSession('Teacher');
            if (!session) return;
            currentTeacherId = session.id;

            // 1. టీచర్ ప్రొఫైల్ వివరాలు మరియు స్టేటస్ చెక్
            await checkTeacherProfileBarrier();
            
            // 2. జాబ్స్ లోడ్ చేయడం
            await fetchFilteredJobs();
        }

        // 🔒 ప్రొఫైల్ లాక్ బారియర్ వెరిఫికేషన్ లాజిక్
        async function checkTeacherProfileBarrier() {
            try {
                const { data: prof, error } = await _supabase
                    .from('teacher_profiles')
                    .select('*')
                    .eq('id', currentTeacherId)
                    .maybeSingle();

                if (error) console.error("Barrier verification issue:", error.message);

                if (prof) {
                    teacherProfile = prof;
                    // ప్రొఫైల్ స్టేటస్ approved అయితే బటన్ అన్‌లాక్ అవుతుంది
                    if (prof.profile_status === 'approved') {
                        isProfileComplete = true;
                    }
                }
            } catch (err) {
                console.error("Barrier verification issue:", err.message);
            }
        }

        // 📥 డేటాబేస్ నుండి జాబ్స్ తేవడం + ఫిల్టర్ చేయడం
        async function fetchFilteredJobs() {
            try {
                const subInput = document.getElementById('filterSubject').value.trim();
                const distInput = document.getElementById('filterDistrict').value.trim();
                const typeInput = document.getElementById('filterSchoolType').value;

                // 1. ఈ టీచర్ ఆల్రెడీ అప్లై చేసిన జాబ్ ఐడీల లిస్ట్ తేవడం
                const { data: appliedList, error: appliedError } = await _supabase
                    .from('job_applications')
                    .select('school_job_id')
                    .eq('teacher_id', currentTeacherId);

                if (appliedError) throw appliedError;

                const appliedJobIds = appliedList ? appliedList.map(app => app.school_job_id) : [];

                // 2. మెయిన్ జాబ్స్ క్వెరీ
                let query = _supabase
   					 .from('school_jobs')
   					 .select(`
     				 	  *,
     				   school_profiles:school_id (school_name)
 			   `);


                query = query.or('status.eq.open,status.eq.Open,status.is.null');

                if (appliedJobIds.length > 0) {
                    query = query.not('id', 'in', `(${appliedJobIds.join(',')})`);
                }

                if (subInput) query = query.ilike('subject', `%${subInput}%`);
                if (distInput) query = query.ilike('district', `%${distInput}%`);
                if (typeInput) query = query.eq('management_type', typeInput); 

                const { data: jobs, error } = await query.order('created_at', { ascending: false });

                if (error) throw error;

                renderJobCards(jobs);
            } catch (err) {
                document.getElementById('jobs-container').innerHTML = `<p style="color: #ef4444;">Error: ${err.message}</p>`;
            }
        }

        // 🃏 UI లో జాబ్స్ కార్డ్స్ రెండర్ చేయడం
        function renderJobCards(jobs) {
            const container = document.getElementById('jobs-container');
            if (!jobs || jobs.length === 0) {
                container.innerHTML = `<p style="color: #94a3b8;">మీరు వెతికిన సలహాలో ప్రస్తుతానికి ఉద్యోగాలు లేవు.</p>`;
                return;
            }

            container.innerHTML = '';
            jobs.forEach(job => {
                const card = document.createElement('div');
                card.className = 'job-card';

                const displayName = (job.school_profiles && job.school_profiles.school_name) 
   					 ? job.school_profiles.school_name 
  				  : (job.school_name || 'MyGuru Partner School');

                const schoolType = job.management_type || 'Private';

                card.innerHTML = `
                    <div>
                        <div class="job-header">
                            <div class="school-info">
                                <h4>${displayName}</h4>
                                <span>📍 ${job.district}, ${job.state} <br><small style="color: #38bdf8;">Type: ${schoolType}</small></span>
                            </div>
                            <div class="job-badge">${job.subject}</div>
                        </div>
                        
                        <div class="job-details-meta">
                            <div><strong>Qualification:</strong> ${job.qualification_required || job.required_qualification || 'Any Degree'}</div>
                            <div><strong>Experience:</strong> ${job.experience_required || 0} Years</div>
                            <div><strong>Estimated Salary:</strong> ₹${job.salary || job.salary_package || 'Negotiable'}</div>
                        </div>
                    </div>
                    
                    <div class="action-zone">
                        ${!isProfileComplete ? 
                            `<div class="lock-warning">⚠️ జాబ్స్ కి అప్లై చేయడానికి మీ ప్రొఫైల్‌ను 100% కంప్లీట్ చేయండి!</div>
                             <button class="btn-job-apply" disabled>Apply Locked</button>` : 
                            `<button class="btn-job-apply" onclick="openApplyModal('${job.id}', '${job.job_title}', '${displayName}')">Apply Now</button>`
                        }
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 1. మోడల్ ఓపెన్ చేయడం
        function openApplyModal(jobId, jobTitle, schoolName) {
            pendingJobId = jobId;
            
            document.getElementById('modalJobTitle').innerText = jobTitle;
            document.getElementById('modalSchoolName').innerText = schoolName;

            const resumeStatusEl = document.getElementById('modalResumeStatus');
            if (teacherProfile && teacherProfile.resume_url) {
                resumeStatusEl.innerHTML = `✅ Attached from Profile (<a href="${teacherProfile.resume_url}" target="_blank" style="color:#38bdf8; text-decoration: underline;">View</a>)`;
            } else {
                resumeStatusEl.innerHTML = `<span style="color:#f87171;">⚠️ No resume in profile</span>`;
            }

            const defaultCover = teacherProfile && teacherProfile.about 
                ? teacherProfile.about 
                : `Respected Principal / Hiring Team,\n\nI am applying for the position of ${jobTitle}. With my qualifications and teaching experience, I am confident in delivering quality education to students. Please review my profile and credentials.\n\nThank you,\n${teacherProfile?.full_name || 'Teacher Candidate'}`;

            document.getElementById('modalCoverLetter').value = defaultCover;
            document.getElementById('applyModal').style.display = 'flex';
        }

        function closeApplyModal() {
            document.getElementById('applyModal').style.display = 'none';
            pendingJobId = null;
        }

        // 2. దరఖాస్తును ఫైనల్ సబ్మిట్ చేయడం
        async function submitFinalApplication() {
            if (!pendingJobId) return;

            const submitBtn = document.getElementById('btnConfirmApply');
            const coverText = document.getElementById('modalCoverLetter').value.trim();
            const resumeUrl = teacherProfile?.resume_url || null;

            submitBtn.innerText = 'Submitting...';
            submitBtn.disabled = true;

            try {
                // ఇప్పటికే అప్లై చేశారా అని చివరి తనిఖీ
                const { data: alreadyApplied } = await _supabase
                    .from('job_applications')
                    .select('id')
                    .eq('school_job_id', pendingJobId)
                    .eq('teacher_id', currentTeacherId);

                if (alreadyApplied && alreadyApplied.length > 0) {
                    alert("⚠️ మీరు ఆల్రెడీ ఈ ఉద్యోగానికి అప్లై చేశారు!");
                    closeApplyModal();
                    return;
                }

                const { error } = await _supabase
                    .from('job_applications')
                    .insert({
                        school_job_id: pendingJobId,
                        teacher_id: currentTeacherId,
                        application_type: 'school',
                        cover_letter: coverText || 'Interested in this role.',
                        resume_url: resumeUrl,
                        employer_status: 'applied',
                        application_status: 'pending',
                        admin_status: 'pending',
                        applied_at: new Date().toISOString()
                    });

                if (error) throw error;

                alert("✓ Success! మీ అప్లికేషన్ విజయవంతంగా స్కూల్‌కు పంపబడింది.");
                closeApplyModal();
                window.location.href = "applied-jobs.html";

            } catch (err) {
                alert("⚠️ Application Failed: " + err.message);
                submitBtn.innerText = 'Confirm & Apply';
                submitBtn.disabled = false;
            }
        }

        document.getElementById('logout-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            await logoutSessionRouter();
        });

        window.onload = initJobSearchEngine;
    </script>
</body>
</html>
