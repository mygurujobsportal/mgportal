<script>
    const SUPABASE_URL = 'https://sugomkzvytuncybafngf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1Z29ta3p2eXR1bmN5YmFmbmdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NjM5ODQsImV4cCI6MjA5OTEzOTk4NH0.JNwUYVXdqj0hyVhf1ZjL-YDvY_AekJg9sZE9fuDH9q0'; // మీ Anon Key ఉంచండి
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 🔒 STRICT LIVE ROLE CHECK (ఈ ఫంక్షన్ non-admin ని స్పాట్‌లోనే నెట్టేస్తుంది)
    async function verifyAdminRole() {
        // 1. LocalStorage Check
        if (localStorage.getItem('adminLoggedIn') !== 'true') {
            window.location.href = 'index.html';
            return;
        }

        // 2. Active Session Check
        const { data: { session } } = await _supabase.auth.getSession();
        
        if (!session) {
            localStorage.removeItem('adminLoggedIn');
            window.location.href = 'index.html';
            return;
        }

        // 3. Database Role Check
        const { data: user, error } = await _supabase
            .from('common_users')
            .select('role')
            .eq('id', session.user.id)
            .maybeSingle();

        // Admin కాకపోతే వెంటనే Logout చేసి index.html కి పంపడం
        if (error || !user || String(user.role).toLowerCase() !== 'admin') {
            alert("⚠️ యాక్సెస్ నిరాకరించబడింది! మీరు అడ్మిన్ కాదు.");
            localStorage.removeItem('adminLoggedIn');
            await _supabase.auth.signOut();
                window.location.href = 'index.html';
        } else {
            // Admin కాబట్టి Stats లోడ్ చేయడం
            loadStats();
        }
    }

    async function loadStats() {
        try {
            const { count: teacherCount } = await _supabase.from('common_users').select('*', { count: 'exact', head: true }).eq('role', 'teacher');
            document.getElementById('totalTeachers').innerText = teacherCount !== null ? teacherCount : 0;

            const { count: schoolCount } = await _supabase.from('common_users').select('*', { count: 'exact', head: true }).eq('role', 'school');
            document.getElementById('totalSchools').innerText = schoolCount !== null ? schoolCount : 0;

            const { count: parentCount } = await _supabase.from('common_users').select('*', { count: 'exact', head: true }).eq('role', 'parent');
            document.getElementById('totalParents').innerText = parentCount !== null ? parentCount : 0;

            const { count: jobCount } = await _supabase.from('jobs').select('*', { count: 'exact', head: true });
            document.getElementById('activeJobs').innerText = jobCount !== null ? jobCount : 0;

            const { count: pendingCount } = await _supabase.from('common_users').select('*', { count: 'exact', head: true }).eq('approval_status', 'pending');
            document.getElementById('pendingApprovals').innerText = pendingCount !== null ? pendingCount : 0;

            const { count: appCount } = await _supabase.from('applications').select('*', { count: 'exact', head: true });
            document.getElementById('totalApplications').innerText = appCount !== null ? appCount : 0;

        } catch (err) {
            console.log("Stats fetch error:", err);
        }
    }

    async function logoutAdmin() {
        localStorage.removeItem('adminLoggedIn');
        await _supabase.auth.signOut();
        window.location.href = 'index.html';
    }

    // Run Security Check On Page Load
    verifyAdminRole();
</script>
